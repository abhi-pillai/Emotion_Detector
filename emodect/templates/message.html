{% extends "base.html" %}
{% block title %}{{ title }} - Emotion Analyzer{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card" style="text-align:center;">
    <h1>{{ title }}</h1>
    <p class="subtitle">{{ message }}</p>
    {% if action_url %}
      <a href="{{ action_url }}"><button type="button" style="margin-top:10px;">{{ action_label }}</button></a>
    {% endif %}
  </div>
</div>
{% endblock %}
