{% extends "base.html" %}
{% block title %}Reset Password - Emotion Analyzer{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1>Reset Password</h1>
    <p class="subtitle">Choose a new password for your account.</p>

    <div id="error-box" class="error-box" hidden></div>
    <div id="success-box" class="success-box" hidden></div>

    <form id="reset-form">
      <label for="password">New Password</label>
      <input type="password" id="password" name="password" minlength="6" required autofocus>
      <small>Minimum 6 characters</small>
      <button type="submit" id="submit-btn">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('error-box');
  const successBox = document.getElementById('success-box');
  const btn = document.getElementById('submit-btn');
  errorBox.hidden = true;
  successBox.hidden = true;
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const res = await fetch(window.location.pathname, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value }),
    });
    const data = await res.json();
    if (res.ok && data.success) {
      successBox.textContent = data.message + ' Redirecting to login...';
      successBox.hidden = false;
      setTimeout(() => window.location.href = '{{ url_for("login") }}', 1500);
    } else {
      errorBox.textContent = data.error || 'Something went wrong';
      errorBox.hidden = false;
    }
  } catch (err) {
    errorBox.textContent = 'Network error. Please try again.';
    errorBox.hidden = false;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Reset Password';
  }
});
</script>
{% endblock %}
