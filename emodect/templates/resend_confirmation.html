{% extends "base.html" %}
{% block title %}Resend Confirmation - Emotion Analyzer{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1>Resend Confirmation Email</h1>
    <p class="subtitle">Enter your account email and we'll resend the confirmation link.</p>

    <div id="error-box" class="error-box" hidden></div>
    <div id="success-box" class="success-box" hidden></div>

    <form id="resend-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
      <button type="submit" id="submit-btn">Resend Email</button>
    </form>

    <p class="switch-link"><a href="{{ url_for('login') }}">Back to login</a></p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('resend-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('error-box');
  const successBox = document.getElementById('success-box');
  const btn = document.getElementById('submit-btn');
  errorBox.hidden = true;
  successBox.hidden = true;
  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    const res = await fetch('{{ url_for("resend_confirmation") }}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value.trim() }),
    });
    const data = await res.json();
    successBox.textContent = data.message;
    successBox.hidden = false;
  } catch (err) {
    errorBox.textContent = 'Network error. Please try again.';
    errorBox.hidden = false;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Resend Email';
  }
});
</script>
{% endblock %}
